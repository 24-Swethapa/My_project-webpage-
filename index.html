<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Animation</title>

<style>
  body {
    font-family: Arial, sans-serif;
    background: #f0f2f5;
    display: flex;
    justify-content: center;
    padding: 20px;
  }

  .container {
    width: 500px;
  }

  header {
    text-align: center;
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 20px;
    font-size: 22px;
    font-weight: bold;
  }

  .post {
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    margin-bottom: 20px;
  }

  .post-header {
    display: flex;
    align-items: center;
    padding: 10px;
    border-bottom: 1px solid #ddd;
  }

  .avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #4267B2;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-right: 10px;
  }

  .post-message {
    padding: 10px;
    overflow: hidden;
    white-space: nowrap;
  }

  /* Horizontal moving text */
  .post-message span {
    display: inline-block;
    animation: moveText 5s linear infinite;
  }

  @keyframes moveText {
    0% {
      transform: translateX(-100%);
    }

    100% {
      transform: translateX(500px);
    }
  }

  .post-actions {
    display: flex;
    justify-content: space-around;
    padding: 10px;
    border-top: 1px solid #ddd;
  }

  button {
    background: #e4e6eb;
    border: none;
    padding: 5px 10px;
    border-radius: 15px;
    cursor: pointer;
  }

  .slideshow {
    position: relative;
    margin: auto;
    width: 100%;
    height: 300px;
    overflow: hidden;
    border-radius: 10px;
  }

  .slideshow img {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    animation: slideShow 20s infinite;
  }

  .slideshow img:nth-child(1) {
    animation-delay: 0s;
  }

  .slideshow img:nth-child(2) {
    animation-delay: 5s;
  }

  .slideshow img:nth-child(3) {
    animation-delay: 10s;
  }

  .slideshow img:nth-child(4) {
    animation-delay: 15s;
  }

  @keyframes slideShow {
    0% {
      opacity: 0;
    }

    5% {
      opacity: 1;
    }

    25% {
      opacity: 1;
    }

    30% {
      opacity: 0;
    }

    100% {
      opacity: 0;
    }
  }

  #clock {
    margin-top: 20px;
    font-size: 22px;
    font-weight: bold;
    color: #444;
    text-align: center;
  }
</style>
</head>

<body>

<div class="container">

  <header>My Social Media Webpage</header>

  <div class="post">

    <div class="post-header">
      <div class="avatar">S</div>
      <div>Swetha</div>
    </div>

    <div class="slideshow">
      <img src="beach.jpg" alt="beach">
      <img src="cat.jpg" alt="cat">
      <img src="flower.jpg" alt="flower">
      <img src="dog.jpg" alt="cartoon">
    </div>

    <!-- Moving Happy Vibes text -->
    <div class="post-message">
      <span>" Happy vibes ! "</span>
    </div>

    <div class="post-actions">
      <button>Like</button>
      <button>Comment</button>
      <button>Share</button>
    </div>

    <div id="clock">Loading time...</div>

  </div>

</div>

<script>
  function updateTime() {
    const now = new Date();
    const timeString = now.toLocaleTimeString();

    document.getElementById("clock").textContent =
      "Current Time: " + timeString;
  }

  updateTime();
  setInterval(updateTime, 1000);
</script>

</body>
</html>
